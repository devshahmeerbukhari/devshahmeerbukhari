<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SaaS architecture — clients, API gateway, microservices, and data layer</title>
  <desc id="desc">A multi-tenant SaaS architecture: Next.js and React Native clients connect through an API gateway to auth, billing, core product, and AI services, backed by MongoDB, Redis, S3, and Pinecone. CI/CD, observability, and infrastructure run across the platform.</desc>

  <defs>
    <linearGradient id="topline" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(960 10) rotate(135) scale(380 280)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <clipPath id="frame">
      <rect width="1000" height="400" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="400" fill="#0B1120"/>
    <rect width="1000" height="400" fill="url(#grid)" opacity="0.35"/>
    <rect width="1000" height="400" fill="url(#halo)"/>
    <rect width="1000" height="4" fill="url(#topline)"/>

    <text x="40" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="2" fill="#A5B4FC">SAAS ARCHITECTURE / MICROSERVICES</text>
    <text x="40" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#F8FAFC">Start small. Scale without a rewrite.</text>

    <rect x="40" y="120" width="190" height="96" rx="14" fill="#111827" stroke="#1F2937"/>
    <text x="56" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.3" fill="#A5B4FC">CLIENTS</text>
    <text x="56" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#F8FAFC">Next.js web</text>
    <text x="56" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#94A3B8">React Native app</text>
    <text x="56" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#64748B">WEB · iOS · ANDROID</text>

    <path d="M230 168H276" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="253" y="157" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#475569">HTTPS</text>

    <rect x="286" y="132" width="154" height="72" rx="14" fill="#111827" stroke="#1F2937"/>
    <text x="302" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#818CF8">EDGE</text>
    <text x="302" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#F8FAFC">API Gateway</text>
    <text x="302" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">auth · rate limits</text>

    <path d="M440 168H472" stroke="#475569" stroke-width="1.5"/>
    <path d="M472 98V308" stroke="#475569" stroke-width="1.5"/>
    <path d="M472 98H504" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M472 168H504" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M472 238H504" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M472 308H504" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <rect x="512" y="70" width="208" height="56" rx="12" fill="#111827" stroke="#1F2937"/>
      <rect x="512" y="82" width="3" height="32" rx="1.5" fill="#818CF8"/>
      <text x="528" y="92" font-size="13.5" font-weight="650" fill="#F8FAFC">Auth</text>
      <text x="528" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">sessions · RBAC</text>

      <rect x="512" y="140" width="208" height="56" rx="12" fill="#111827" stroke="#1F2937"/>
      <rect x="512" y="152" width="3" height="32" rx="1.5" fill="#A78BFA"/>
      <text x="528" y="162" font-size="13.5" font-weight="650" fill="#F8FAFC">Billing</text>
      <text x="528" y="179" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">plans · webhooks</text>

      <rect x="512" y="210" width="208" height="56" rx="12" fill="#111827" stroke="#1F2937"/>
      <rect x="512" y="222" width="3" height="32" rx="1.5" fill="#22D3EE"/>
      <text x="528" y="232" font-size="13.5" font-weight="650" fill="#F8FAFC">Core product</text>
      <text x="528" y="249" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">product APIs</text>

      <rect x="512" y="280" width="208" height="56" rx="12" fill="#111827" stroke="#1F2937"/>
      <rect x="512" y="292" width="3" height="32" rx="1.5" fill="#34D399"/>
      <text x="528" y="302" font-size="13.5" font-weight="650" fill="#F8FAFC">AI / RAG</text>
      <text x="528" y="319" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">retrieval · agents</text>
    </g>

    <path d="M720 98H752M720 168H752M720 238H752M720 308H752" stroke="#334155" stroke-width="1.2"/>
    <path d="M752 98V308" stroke="#334155" stroke-width="1.2"/>
    <path d="M752 203H772" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="780" y="70" width="180" height="266" rx="14" fill="#0F172A" stroke="#1E293B"/>
    <text x="796" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#94A3B8">DATA LAYER</text>
    <line x1="780" y1="106" x2="960" y2="106" stroke="#1E293B"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <rect x="796" y="128" width="7" height="7" rx="2" fill="#47A248"/>
      <text x="812" y="134" font-size="11.5" font-weight="600" fill="#E2E8F0">MongoDB</text>
      <text x="812" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748B">primary data</text>

      <rect x="796" y="184" width="7" height="7" rx="2" fill="#DC382D"/>
      <text x="812" y="190" font-size="11.5" font-weight="600" fill="#E2E8F0">Redis</text>
      <text x="812" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748B">cache + queues</text>

      <rect x="796" y="240" width="7" height="7" rx="2" fill="#F59E0B"/>
      <text x="812" y="246" font-size="11.5" font-weight="600" fill="#E2E8F0">S3</text>
      <text x="812" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748B">assets + exports</text>

      <rect x="796" y="296" width="7" height="7" rx="2" fill="#818CF8"/>
      <text x="812" y="302" font-size="11.5" font-weight="600" fill="#E2E8F0">Pinecone</text>
      <text x="812" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748B">vectors</text>
    </g>

    <rect x="40" y="344" width="920" height="28" rx="14" fill="#0F172A" stroke="#1E293B"/>
    <text x="500" y="362" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">CI/CD · GitHub Actions      OBSERVABILITY · logs / metrics / traces      INFRA · Docker · Vercel · AWS S3</text>

    <rect x="0.5" y="0.5" width="999" height="399" rx="23.5" stroke="#1E293B"/>
  </g>
</svg>
