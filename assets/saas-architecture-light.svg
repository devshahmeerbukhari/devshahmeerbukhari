<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SaaS architecture — clients, API gateway, microservices, and data layer</title>
  <desc id="desc">A multi-tenant SaaS architecture: Next.js and React Native clients connect through an API gateway to auth, billing, core product, and AI services, backed by MongoDB, Redis, S3, and Pinecone. CI/CD, observability, and infrastructure run across the platform.</desc>

  <defs>
    <linearGradient id="topline" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(960 10) rotate(135) scale(380 280)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94A3B8"/>
    </marker>
    <clipPath id="frame">
      <rect width="1000" height="400" rx="24"/>
    </clipPath>
      <linearGradient id="neonSweep" x1="0.5" y1="0.5" x2="999.5" y2="0.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.55"/>
      <stop offset="18%" stop-color="#4F46E5" stop-opacity="1"/>
      <stop offset="82%" stop-color="#4F46E5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.55"/>
</linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="400" fill="#F8FAFC"/>
    <rect width="1000" height="400" fill="url(#grid)" opacity="0.6"/>
    <rect width="1000" height="400" fill="url(#halo)"/>
    <rect width="1000" height="4" fill="url(#topline)"/>


    <text x="40" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="2" fill="#4F46E5">SAAS ARCHITECTURE / MICROSERVICES</text>
    <text x="40" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#0F172A">Start small. Scale without a rewrite.</text>

    <rect x="40" y="120" width="190" height="96" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="56" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.3" fill="#4F46E5">CLIENTS</text>
    <text x="56" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0F172A">Next.js web</text>
    <text x="56" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">React Native app</text>
    <text x="56" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#64748B">WEB · iOS · ANDROID</text>

    <path d="M230 168H276" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="253" y="157" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#94A3B8">HTTPS</text>

    <rect x="286" y="132" width="154" height="72" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="302" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#4F46E5">EDGE</text>
    <text x="302" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0F172A">API Gateway</text>
    <text x="302" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">auth · rate limits</text>

    <path d="M440 168H472" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M472 98V308" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M472 98H504" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M472 168H504" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M472 238H504" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M472 308H504" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <rect x="512" y="70" width="208" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="512" y="82" width="3" height="32" rx="1.5" fill="#4F46E5"/>
      <text x="528" y="92" font-size="13.5" font-weight="650" fill="#0F172A">Auth</text>
      <text x="528" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">sessions · RBAC</text>

      <rect x="512" y="140" width="208" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="512" y="152" width="3" height="32" rx="1.5" fill="#7C3AED"/>
      <text x="528" y="162" font-size="13.5" font-weight="650" fill="#0F172A">Billing</text>
      <text x="528" y="179" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">plans · webhooks</text>

      <rect x="512" y="210" width="208" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="512" y="222" width="3" height="32" rx="1.5" fill="#0891B2"/>
      <text x="528" y="232" font-size="13.5" font-weight="650" fill="#0F172A">Core product</text>
      <text x="528" y="249" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">product APIs</text>

      <rect x="512" y="280" width="208" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="512" y="292" width="3" height="32" rx="1.5" fill="#059669"/>
      <text x="528" y="302" font-size="13.5" font-weight="650" fill="#0F172A">AI / RAG</text>
      <text x="528" y="319" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">retrieval · agents</text>
        <rect x="0.5" y="0.5" width="999.0" height="399.0" rx="23.5" fill="none" stroke="url(#neonSweep)" stroke-width="3" stroke-linecap="round" stroke-dasharray="180 2576" filter="url(#glow)" opacity="0.95"><animate attributeName="stroke-dashoffset" from="0" to="-2756" dur="4s" repeatCount="indefinite"/></rect>
  </g>

    <path d="M720 98H752M720 168H752M720 238H752M720 308H752" stroke="#94A3B8" stroke-width="1.2"/>
    <path d="M752 98V308" stroke="#94A3B8" stroke-width="1.2"/>
    <path d="M752 203H772" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="780" y="70" width="180" height="266" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="796" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#475569">DATA LAYER</text>
    <line x1="780" y1="106" x2="960" y2="106" stroke="#E2E8F0"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <rect x="796" y="128" width="7" height="7" rx="2" fill="#47A248"/>
      <text x="812" y="134" font-size="11.5" font-weight="600" fill="#1E293B">MongoDB</text>
      <text x="812" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748B">primary data</text>

      <rect x="796" y="184" width="7" height="7" rx="2" fill="#DC382D"/>
      <text x="812" y="190" font-size="11.5" font-weight="600" fill="#1E293B">Redis</text>
      <text x="812" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748B">cache + queues</text>

      <rect x="796" y="240" width="7" height="7" rx="2" fill="#F59E0B"/>
      <text x="812" y="246" font-size="11.5" font-weight="600" fill="#1E293B">S3</text>
      <text x="812" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748B">assets + exports</text>

      <rect x="796" y="296" width="7" height="7" rx="2" fill="#4F46E5"/>
      <text x="812" y="302" font-size="11.5" font-weight="600" fill="#1E293B">Pinecone</text>
      <text x="812" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748B">vectors</text>
    </g>

    <rect x="40" y="344" width="920" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="500" y="362" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">CI/CD · GitHub Actions      OBSERVABILITY · logs / metrics / traces      INFRA · Docker · Vercel · AWS S3</text>

    <rect x="0.5" y="0.5" width="999" height="399" rx="23.5" stroke="#E2E8F0"/>
  </g>
</svg>
